<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zion · 南天门</title>
<link rel="stylesheet" href="styles/tokens.css"/>
<style>
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-sans);
    color: var(--text-primary);
    background: var(--bg-subtle);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-size: 14px;
  }
  button { background: none; border: none; cursor: pointer; font-family: inherit; color: inherit; }
  input, select, textarea { font-family: inherit; }
  a { color: inherit; text-decoration: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--neutral-200); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--neutral-300); }

  /* Tags */
  .tag {
    display: inline-flex; align-items: center;
    padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; line-height: 1.4;
    letter-spacing: 0.02em;
  }
  .tag-bullish { background: var(--success-50); color: var(--success-700); }
  .tag-bearish { background: var(--danger-50); color: var(--danger-700); }
  .tag-neutral { background: var(--neutral-100); color: var(--neutral-600); }
  .tag-market { background: var(--neutral-100); color: var(--neutral-600); padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: 500; }

  /* Inputs */
  .input-base {
    width: 100%; height: 40px;
    padding: 0 12px;
    background: var(--bg-base);
    border: 1px solid var(--border-default);
    border-radius: 8px;
    font-size: 14px;
    color: var(--text-primary);
    transition: border-color 150ms, box-shadow 150ms;
    outline: none;
  }
  .input-base:focus {
    border-color: var(--primary-500);
    box-shadow: 0 0 0 3px rgba(61,99,221,0.1);
  }
  .input-base.error {
    border-color: var(--danger-500);
    box-shadow: 0 0 0 3px rgba(220,38,38,0.08);
  }
  .input-base::placeholder { color: var(--text-muted); }

  /* Buttons */
  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 8px 16px; height: 36px;
    background: var(--primary-500);
    color: #fff;
    border-radius: 8px;
    font-size: 14px; font-weight: 600;
    transition: background 150ms;
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-600); }
  .btn-primary:disabled { background: var(--neutral-300); cursor: not-allowed; }

  .btn-secondary {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 8px 14px; height: 36px;
    background: var(--bg-base);
    color: var(--text-primary);
    border: 1px solid var(--border-default);
    border-radius: 8px;
    font-size: 14px; font-weight: 600;
    transition: all 150ms;
  }
  .btn-secondary:hover:not(:disabled) { border-color: var(--border-strong); background: var(--neutral-50); }
  .btn-secondary:disabled { color: var(--text-disabled); cursor: not-allowed; }

  .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px 10px;
    color: var(--text-secondary);
    border-radius: 6px;
    font-size: 13px;
    transition: background 150ms;
  }
  .btn-ghost:hover { background: var(--neutral-100); color: var(--text-primary); }

  select.input-base { padding-right: 32px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="scripts/data.js"></script>
<script type="text/babel" src="scripts/shared.jsx"></script>
<script type="text/babel" src="scripts/login.jsx"></script>
<script type="text/babel" src="scripts/sidebar.jsx"></script>
<script type="text/babel" src="scripts/recommend.jsx"></script>
<script type="text/babel" src="scripts/detail.jsx"></script>
<script type="text/babel" src="scripts/causal.jsx"></script>

<script type="text/babel">
function App() {
  const { user, route } = useApp();

  if (!user) return <LoginPage/>;

  if (route.name === 'causal') {
    return (
      <div data-screen-label="Causal" style={{ display: 'flex', minHeight: '100vh' }}>
        <Sidebar/>
        <CausalPage stockId={route.stockId} kpId={route.kpId}/>
        <Toast/>
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', minHeight: '100vh' }}>
      <Sidebar/>
      <main style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}
        data-screen-label={route.name === 'recommend' ? 'Recommend' : 'Detail'}>
        {route.name === 'recommend' && <RecommendPage/>}
        {route.name === 'detail' && <DetailPage stockId={route.stockId}/>}
      </main>
      <Toast/>
    </div>
  );
}

function Root() {
  return <AppProvider><App/></AppProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
